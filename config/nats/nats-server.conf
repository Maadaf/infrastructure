port: 4222
http_port: 8222

jetstream {
  store_dir: "/data"
}

authorization {
  users: [
    {
      user: $FREEFLOW_NATS_USER
      password: $FREEFLOW_NATS_PASSWORD
    }
  ]
}

tls {
  cert_file: "/run/freeflow-tls/server.crt"
  key_file: "/run/freeflow-tls/server.key"
  ca_file: "/run/freeflow-tls/ca.crt"
  min_version: "1.2"
  timeout: 5
}
