# Lab E2E (pórtico): NATS + MinIO + vehicle-tracker + edge-uploader → central-api.
# Simulador (gémeo digital) vive em compose.central.yaml — não neste stack.
# Correr a partir desta pasta (infrastructure/). Rede: freeflow_default.
#
#   docker network create freeflow_default
#   docker network create freeflow_central
#   docker compose -f compose.central.yaml up -d --build
#   docker compose -f compose.lab.yaml up -d --build
#   .\lab\smoke-central.ps1
#
# Caminho feliz sem hardware: o simulador (central) publica os 5 eventos (incl. wim).
# Gateways de equipamento ficam de fora; para stack completo ver compose.full.yaml.
# Se gateways órfãos (camera/lidar/radar/rfid/wim) estiverem up, o smoke para-os.

name: freeflow

services:
  nats:
    image: nats:2.10-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks: [default]
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${FREEFLOW_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${FREEFLOW_MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [default]
    restart: unless-stopped

  vehicle-tracker:
    build:
      context: ..
      dockerfile: vehicle-tracker/Dockerfile
    environment:
      VT_SERVICE_NAME: vehicle-tracker
      VT_LOG_LEVEL: ${VT_LOG_LEVEL:-INFO}
      VT_HEALTH_PORT: "8080"
      VT_NATS_URL: nats://nats:4222
      VT_SOURCE_STREAM: FREEFLOW_EVENTS
      VT_SOURCE_SUBJECT: freeflow.events.>
      VT_RESULT_STREAM: FREEFLOW_PASSAGES
      VT_RESULT_SUBJECT_PREFIX: freeflow.passages
      VT_PUBLISH_RESULTS_ENABLED: "true"
      VT_DATABASE_PATH: /data/vehicle-tracker.db
      VT_CORRELATION_WINDOW_SECONDS: "8"
      VT_PASSAGE_FINALIZATION_SECONDS: "3"
      VT_CORRELATION_SPEED_TOLERANCE_KMH: "20"
      VT_CORRELATION_MIN_CONFIDENCE: "0.5"
      VT_CORRELATION_AMBIGUITY_MARGIN: "0.1"
      VT_MAX_EVENT_AGE_SECONDS: "2592000"
      VT_MAX_FUTURE_SKEW_SECONDS: "300"
    ports:
      - "8081:8080"
    volumes:
      - tracker-data:/data
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "vehicle-tracker", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [default]
    restart: unless-stopped

  edge-uploader:
    build:
      context: ..
      dockerfile: edge-uploader/Dockerfile
      args:
        VERSION: lab
        REVISION: lab
    environment:
      EU_DATABASE_PATH: /data/edge-uploader.db
      EU_BIND_ADDRESS: 0.0.0.0:8082
      EU_NATS_URL: nats://nats:4222
      EU_NATS_STREAM: FREEFLOW_PASSAGES
      EU_NATS_DURABLE: edge-uploader-lab-v1
      EU_CLOUD_BASE_URL: http://central-api:8090
      EU_CLOUD_TOKEN: ${CENTRAL_AUTH_TOKEN:-}
      EU_EVIDENCE_ROOT: /evidence
      EU_UPLOAD_EXPIRED: "true"
      EU_RETENTION_SECONDS: "0"
      EU_CLEANUP_INTERVAL_SECONDS: "5"
      EU_MAX_CONCURRENCY: "2"
      EU_MIN_FREE_DISK_RATIO: "0.20"
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8082:8082"
    volumes:
      - uploader-data:/data
      - lab-evidence:/evidence
    depends_on:
      nats:
        condition: service_healthy
      vehicle-tracker:
        condition: service_started
    healthcheck:
      test: ["CMD", "edge-uploader", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [default]
    restart: unless-stopped

volumes:
  nats-data:
  minio-data:
  tracker-data:
  uploader-data:
  lab-evidence:

# Usa a rede já criada pelos outros Composes FreeFlow (label default).
networks:
  default:
    name: freeflow_default
    external: true
